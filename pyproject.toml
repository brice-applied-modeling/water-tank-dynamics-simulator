[project]
name = "water-tank-drain-simulation"
version = "0.1.0"
description = "a small Python-based scientific computing application to simulate the time-dependent water depth in a tank using ordinary differential equations (ODEs)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "spyder-kernels>=3.1.7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tank_dynamics"]
